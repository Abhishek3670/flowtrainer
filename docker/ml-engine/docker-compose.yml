version: '3.8'

services:
  ml-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowcraft-ml-engine
    ports:
      - "8080:8080"
    environment:
      - ML_ENGINE_HOST=0.0.0.0
      - ML_ENGINE_PORT=8080
      - FLOWCRAFT_BACKEND_URL=http://host.docker.internal:4000
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flowcraft-network

networks:
  flowcraft-network:
    external: true
    name: flowcraft-network
