services:
  mongodb:
    image: mongo:7.0
    container_name: flowcraft-mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: flowcraft
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - flowcraft-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowcraft-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/flowcraft?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - flowcraft-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowcraft-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - flowcraft-network

volumes:
  mongodb_data:

networks:
  flowcraft-network:
    driver: bridge
